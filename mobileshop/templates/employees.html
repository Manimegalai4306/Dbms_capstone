{% extends 'base.html' %} {% block content %}
<h2>Employees</h2>

<!-- Toggle Add Employee Form -->
<h3><a href="#" onclick="toggleEmployeeForm()">+ Add Employee</a></h3>

<!-- Add Employee Form (Initially Hidden) -->
<div id="employee-form" style="display: none; margin-bottom: 30px">
  <form
    action="{{ url_for('add_employee') }}"
    method="POST"
    style="max-width: 400px"
  >
    <label for="employee_id">Employee ID:</label>
    <input
      type="number"
      name="employee_id"
      id="employee_id"
      value="{{ next_employee_id }}"
      readonly
      required
    /><br /><br />

    <label for="name">Name:</label>
    <input type="text" name="name" id="name" required /><br /><br />

    <label for="position">Position:</label>
    <input type="text" name="position" id="position" required /><br /><br />

    <label for="salary">Salary:</label>
    <input
      type="number"
      name="salary"
      id="salary"
      step="1000.00"
      required
    /><br /><br />

    <label for="contact_no">Contact No:</label>
    <input type="text" name="contact_no" id="contact_no" required /><br /><br />

    <input type="submit" value="Add Employee" />
  </form>
</div>

<!-- Employee Table -->
<table border="1" cellpadding="8" cellspacing="0">
  <thead style="background-color: #f2f2f2">
    <tr>
      <th>Employee ID</th>
      <th>Name</th>
      <th>Position</th>
      <th>Salary</th>
      <th>Contact No</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody>
    {% for employee in employees %}
    <tr>
      <td>{{ employee[0] }}</td>
      <td>{{ employee[1] }}</td>
      <td>{{ employee[2] }}</td>
      <td>{{ employee[3] }}</td>
      <td>{{ employee[4] }}</td>
      <td style="white-space: nowrap">
        <!-- Edit Button -->
        <a href="{{ url_for('edit_employee', employee_id=employee[0]) }}">
          <button type="button">Edit</button>
        </a>

        <!-- Delete Button -->
        <form
          action="{{ url_for('delete_employee', employee_id=employee[0]) }}"
          method="POST"
          style="display: inline"
          onsubmit="return confirm('Are you sure you want to delete this employee?');"
        >
          <button type="submit">Delete</button>
        </form>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>

<!-- JavaScript to Toggle Form -->
<script>
  function toggleEmployeeForm() {
    const form = document.getElementById("employee-form");
    form.style.display = form.style.display === "none" ? "block" : "none";
  }
</script>
{% endblock %}
