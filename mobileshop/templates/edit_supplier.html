{% extends 'base.html' %} {% block content %}
<h2>Edit Supplier</h2>

<form method="POST">
  <label for="name">Supplier Name:</label>
  <input
    type="text"
    name="name"
    id="name"
    value="{{ supplier[1] }}"
    required
  /><br /><br />

  <label for="contact_no">Contact Number:</label>
  <input
    type="text"
    name="contact_no"
    id="contact_no"
    value="{{ supplier[2] }}"
    required
  /><br /><br />

  <label for="email">Email:</label>
  <input
    type="email"
    name="email"
    id="email"
    value="{{ supplier[3] }}"
    required
  /><br /><br />

  <label for="address">Address:</label>
  <textarea name="address" id="address" required>{{ supplier[4] }}</textarea
  ><br /><br />

  <input type="submit" value="Update Supplier" />
</form>
{% endblock %}
