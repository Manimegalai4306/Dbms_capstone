{% extends 'base.html' %} {% block content %}
<h2>Edit Customer</h2>

<form
  action="{{ url_for('update_customer', customer_id=customer[0]) }}"
  method="POST"
>
  <label>Name:</label>
  <input type="text" name="name" value="{{ customer[1] }}" required /><br />

  <label>Contact No:</label>
  <input
    type="text"
    name="contact_no"
    value="{{ customer[2] }}"
    required
  /><br />

  <label>Email:</label>
  <input type="email" name="email" value="{{ customer[3] }}" required /><br />

  <input type="submit" value="Update Customer" />
</form>

<br />
<a href="{{ url_for('customers') }}">Back to Customers</a>
{% endblock %}
