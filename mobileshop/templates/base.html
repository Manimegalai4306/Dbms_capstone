<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mobile Shop</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body>
    <header>
      <h1>Welcome to Mobile Shop</h1>
      <nav>
        <a href="{{ url_for('index') }}">Home</a>
        <a href="{{ url_for('products') }}">Products</a>
        <a href="{{ url_for('sales') }}">Sales</a>
        <a href="{{ url_for('customers') }}">Customers</a>
        <a href="{{ url_for('employees_list') }}">Employees</a>
        <a href="{{ url_for('suppliers') }}">Suppliers</a>
        <a href="{{ url_for('take_order') }}">Take Order</a>
        <a href="{{ url_for('view_orders') }}">View Orders</a>
      </nav>
    </header>

    <main>{% block content %} {% endblock %}</main>
  </body>
</html>
