{% extends 'base.html' %} {% block content %}
<h2>Suppliers</h2>

<!-- Toggle Add Supplier Form -->
<h3><a href="#" onclick="toggleSupplierForm()">+ Add Supplier</a></h3>

<!-- Add Supplier Form (Initially Hidden) -->
<div id="supplier-form" style="display: none; margin-bottom: 30px">
  <form
    action="{{ url_for('add_supplier') }}"
    method="POST"
    style="max-width: 400px"
  >
    <label for="supplier_id">Supplier ID:</label>
    <input
      type="text"
      name="supplier_id"
      id="supplier_id"
      value="{{ next_supplier_id }}"
      readonly
      required
    /><br /><br />

    <label for="name">Supplier Name:</label>
    <input type="text" name="name" id="name" required /><br /><br />

    <label for="contact_no">Contact Number:</label>
    <input type="text" name="contact_no" id="contact_no" required /><br /><br />

    <label for="email">Email:</label>
    <input type="email" name="email" id="email" required /><br /><br />

    <label for="address">Address:</label>
    <textarea name="address" id="address" required></textarea><br /><br />

    <input type="submit" value="Add Supplier" />
  </form>
</div>

<!-- Suppliers Table -->
<table border="1" cellpadding="8" cellspacing="0">
  <thead style="background-color: #f2f2f2">
    <tr>
      <th>Supplier ID</th>
      <th>Name</th>
      <th>Contact</th>
      <th>Email</th>
      <th>Address</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    {% for supplier in suppliers %}
    <tr>
      <td>{{ supplier[0] }}</td>
      <td>{{ supplier[1] }}</td>
      <td>{{ supplier[2] }}</td>
      <td>{{ supplier[3] }}</td>
      <td>{{ supplier[4] }}</td>
      <td>
        <a href="{{ url_for('edit_supplier', supplier_id=supplier[0]) }}"
          >Edit</a
        >
        |
        <a
          href="{{ url_for('delete_supplier', supplier_id=supplier[0]) }}"
          onclick="return confirm('Are you sure you want to delete this supplier?');"
        >
          Delete
        </a>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>

<!-- JavaScript to Toggle Form -->
<script>
  function toggleSupplierForm() {
    const form = document.getElementById("supplier-form");
    form.style.display = form.style.display === "none" ? "block" : "none";
  }
</script>
{% endblock %}
