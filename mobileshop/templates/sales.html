{% extends 'base.html' %} {% block content %}
<h2>Sales</h2>

<!-- Toggle Add Sale Form -->
<h3><a href="#" onclick="toggleSaleForm()">+ Add Sale</a></h3>

<!-- Hidden Add Sale Form -->
<div id="sale-form" style="display: none; margin-bottom: 30px">
  <form
    method="POST"
    action="{{ url_for('add_sale') }}"
    style="max-width: 400px"
  >
    <label for="sale_id">Sale ID:</label>
    <input
      type="number"
      name="sale_id"
      value="{{ next_sale_id }}"
      readonly
      required
    /><br /><br />

    <label for="date">Date:</label>
    <input type="date" name="date" required /><br /><br />

    <label for="customer_id">Customer ID:</label>
    <input type="number" name="customer_id" required /><br /><br />

    <label for="product_id">Product ID:</label>
    <input type="number" name="product_id" required /><br /><br />

    <label for="quantity">Quantity:</label>
    <input type="number" name="quantity" min="1" required /><br /><br />

    <button type="submit">Add Sale</button>
  </form>
</div>

<!-- Sales Table -->
<table border="1" cellpadding="8" cellspacing="0">
  <thead>
    <tr style="background-color: #f2f2f2">
      <th>Sale ID</th>
      <th>Product ID</th>
      <th>Customer ID</th>
      <th>Quantity</th>
      <th>Total Amount</th>
      <th>Sale Date</th>
    </tr>
  </thead>
  <tbody>
    {% for sale in sales %}
    <tr>
      <td>{{ sale[0] }}</td>
      <td>{{ sale[3] }}</td>
      <td>{{ sale[2] }}</td>
      <td>{{ sale[4] }}</td>
      <td>{{ sale[5] }}</td>
      <td>{{ sale[1] }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>

<!-- JavaScript for toggling form -->
<script>
  function toggleSaleForm() {
    const form = document.getElementById("sale-form");
    form.style.display = form.style.display === "none" ? "block" : "none";
  }
</script>
{% endblock %}
